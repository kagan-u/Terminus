<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TERMINUS - Interactive Simulator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>TERMINUS</h1>
            <p class="subtitle">Recursive Zip Bomb Simulator</p>
        </header>

        <div class="config-panel">
            <h2>Configuration</h2>
            <div class="config-grid">
                <div class="config-item">
                    <label for="branching">Branching Factor</label>
                    <input type="number" id="branching" value="16" min="2" max="1000">
                </div>
                <div class="config-item">
                    <label for="level">Depth Level</label>
                    <input type="number" id="level" value="50" min="1" max="200">
                </div>
                <div class="config-item">
                    <label for="payload">Payload (bytes)</label>
                    <input type="number" id="payload" value="43" min="1" max="10000">
                </div>
                <div class="config-item">
                    <label for="payload_type">Payload Type</label>
                    <select id="payload_type">
                        <option value="zeros">Zeros</option>
                        <option value="text">Text</option>
                        <option value="random">Random</option>
                        <option value="binary">Binary</option>
                    </select>
                </div>
            </div>
            <button id="simulate-btn" onclick="runSimulation()">SIMULATE</button>
        </div>

        <div id="results" class="results-panel" style="display:none;">
            <h2>Results</h2>
            <div class="results-grid">
                <div class="result-card">
                    <h3>Total Files</h3>
                    <p class="big-number" id="total-files">-</p>
                    <p class="small-text" id="total-files-sci">-</p>
                </div>
                <div class="result-card">
                    <h3>Zip Size</h3>
                    <p class="big-number" id="zip-size">-</p>
                </div>
                <div class="result-card">
                    <h3>Output Size</h3>
                    <p class="big-number" id="output-size">-</p>
                </div>
                <div class="result-card">
                    <h3>Ratio</h3>
                    <p class="big-number" id="ratio">-</p>
                </div>
            </div>

            <div class="charts-grid">
                <div id="chart-zip-size" class="chart"></div>
                <div id="chart-file-count" class="chart"></div>
                <div id="chart-ratio" class="chart"></div>
                <div id="chart-comparison" class="chart"></div>
            </div>

            <div class="table-container">
                <h3>Level Details</h3>
                <table id="level-table">
                    <thead>
                        <tr>
                            <th>Level</th>
                            <th>Zip Size</th>
                            <th>File Count</th>
                            <th>Ratio</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
